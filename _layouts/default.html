<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title == "Home" %}Shubham Saboo — Robotics Engineer{% else %}{{ page.title }} · Shubham Saboo{% endif %}</title>
  <meta name="description" content="Robotics engineer specializing in aerial systems, autonomy, and manipulation. MRSD student at Carnegie Mellon University.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body data-theme="dark">

  <nav>
    <a href="{{ '/' | relative_url }}" class="nav-logo">SS</a>
    <ul class="nav-links">
      <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
      <li><a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}class="active"{% endif %}>Projects</a></li>
      <li><a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>About</a></li>
      <li><a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a></li>
      <li><a href="{{ '/assets/Shubham_Saboo_Resume.pdf' | relative_url }}" class="nav-resume" target="_blank" rel="noopener">Resume ↓</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">◐</button>
  </nav>

  <main>
    {{ content }}

    <footer>
      <div class="footer-left">Shubham Saboo · Pittsburgh, PA</div>
      <div class="footer-links">
        <a href="https://www.linkedin.com/in/shubhamsaboo270899" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/FD-Shubham" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:spsaboo@andrew.cmu.edu">Email</a>
      </div>
    </footer>
  </main>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
